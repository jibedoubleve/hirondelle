workflow: GitHubFlow/v1

# Conventional Commits drive the version increment (see CONTRIBUTING.md#versioning).
# The strongest increment found since the last tag is applied once.
major-version-bump-message: '^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([\w\s\-,/]*\))?!:'
minor-version-bump-message: '^feat(\([\w\s\-,/]*\))?:'
patch-version-bump-message: '^(fix|perf)(\([\w\s\-,/]*\))?:'

branches:
  main:
    label: beta # untagged commits on master are versioned X.Y.Z-beta.N
