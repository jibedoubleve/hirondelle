name: CI

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a run on master: it may be creating the release draft.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # post the coverage comment on the pull request

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # GitVersion needs the full history and the tags

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore tools
        run: dotnet tool restore

      - name: Build, test & coverage
        run: dotnet cake --target=Coverage

      # Reads the Cobertura file filtered by ReportGenerator (generated code excluded)
      # and writes code-coverage-results.md.
      - name: Coverage summary
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: coveragereport/Cobertura.xml
          format: markdown
          badge: true
          indicators: true
          output: both
          thresholds: '60 80'

      - name: Add coverage to the run summary
        run: cat code-coverage-results.md >> "$GITHUB_STEP_SUMMARY"

      # Skipped on pull requests from forks: their token cannot write comments.
      - name: Comment coverage on the pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: marocchino/sticky-pull-request-comment@v3.0.5
        with:
          header: coverage
          path: code-coverage-results.md

      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-report
          path: coveragereport/

  release-draft:
    name: Release draft
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create / update the GitHub release
      issues: read    # read the milestone and its issues

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore tools
        run: dotnet tool restore

      - name: Create or update the release draft
        run: dotnet cake --target=Release-Draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
